<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGA Premium</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background: #f5f5f5;
    }
    .header {
      background: #6200ee;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
    }
    .premium-card {
      background: white;
      margin: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .premium-card img {
      width: 40px;
      height: 40px;
      margin-right: 12px;
    }
    .premium-card span {
      font-size: 16px;
      flex: 1;
    }
    .premium-card small {
      color: gray;
    }
    .plan-page {
      display: none;
      background: white;
      margin: 12px;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .plan {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .plan:hover {
      background: #f0f0f0;
    }
    button {
      background: #6200ee;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">MEGA Premium</div>
<style>
  .back-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #6200ee;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .back-btn:active {
    transform: scale(0.9) translateX(-5px); /* shrink + slide left */
    background: #4a00b5; /* darker purple when pressed */
  }

  .back-btn svg {
    transition: transform 0.2s ease;
  }

  .back-btn:active svg {
    transform: translateX(-3px); /* arrow shifts left */
  }
</style>

<!-- Telegram-style Premium Page with Big M Logo Spin -->
<div class="container" style="max-width:500px;margin:20px auto;padding:20px;background:white;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1); text-align:center;">
  <!-- Spinning M Logo -->
  <div class="logo-container" style="margin-bottom:30px;">
    <div class="spinning-logo">M</div>
  </div>
<button class="back-btn" onclick="history.back()">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 18 9 12 15 6"></polyline>
  </svg>
</button>
  <h3 style="margin-bottom:20px;">Unlock All MEGA Features</h3>
  
  <div class="features" style="text-align:left;margin-bottom:30px;">
    <div class="feature-item" style="display:flex;align-items:center;margin-bottom:12px;"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828479.png" width="24" height="24" style="margin-right:12px;"> Profile Verification (Blue Tick)</div>
    <div class="feature-item" style="display:flex;align-items:center;margin-bottom:12px;"><img src="https://cdn-icons-png.flaticon.com/512/716/716784.png" width="24" height="24" style="margin-right:12px;"> Advanced File Manager</div>
    <div class="feature-item" style="display:flex;align-items:center;margin-bottom:12px;"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828911.png" width="24" height="24" style="margin-right:12px;"> Custom Themes & Profile Frames</div>
    <div class="feature-item" style="display:flex;align-items:center;margin-bottom:12px;"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828919.png" width="24" height="24" style="margin-right:12px;"> Extended Status & Analytics</div>
    <div class="feature-item" style="display:flex;align-items:center;margin-bottom:12px;"><img src="https://img.icons8.com/color/48/phone.png" width="24" height="24" style="margin-right:12px;"> Priority Calls & Video</div>
    <div class="feature-item" style="display:flex;align-items:center;margin-bottom:12px;"><img src="https://img.icons8.com/fluency/48/username.png" width="24" height="24" style="margin-right:12px;"> Username & Hidden Number</div>
    <div class="feature-item" style="display:flex;align-items:center;margin-bottom:12px;"><img src="https://img.icons8.com/fluency/48/broadcasting.png" width="24" height="24" style="margin-right:12px;"> Channel Boosting & Insights</div>
  </div>

  <button class="buy-btn" style="display:block;width:100%;background:#6200ee;color:white;border:none;padding:15px;font-size:18px;font-weight:bold;border-radius:10px;cursor:pointer;" id="buyPremiumBtn">Unlock MEGA Premium</button>
</div>

<style>
/* Big spinning M animation like Telegram */
.spinning-logo {
  font-size: 80px;
  font-weight: bold;
  color: #6200ee;
  display: inline-block;
  animation: spinBigM 2s linear infinite;
  transform-origin: center center;
}

@keyframes spinBigM {
  0% { transform: rotateY(0deg) rotateX(0deg) scale(1); }
  25% { transform: rotateY(90deg) rotateX(15deg) scale(1.05); }
  50% { transform: rotateY(180deg) rotateX(0deg) scale(1); }
  75% { transform: rotateY(270deg) rotateX(-15deg) scale(1.05); }
  100% { transform: rotateY(360deg) rotateX(0deg) scale(1); }
}
</style>

<script>
  const currentUser = { id: "12345", premium: false };

  document.getElementById("buyPremiumBtn").onclick = () => {
    if(currentUser.premium){
      alert("You already have MEGA Premium! 🎉");
      return;
    }

    const plan = prompt("Choose plan: weekly / monthly / yearly", "monthly");
    if(plan){
      alert(`Processing ${plan} plan...`);
      setTimeout(() => {
        currentUser.premium = true;
        alert("🎉 Congratulations! You are now MEGA Premium!");
      }, 1000);
    }
  };
</script>
<!-- Step One: Dynamic Feature List -->
<div id="featureList" style="margin:12px;"></div>

<!-- Plans -->
<div id="plansPage" class="plan-page">
    <h3>Select Your Plan</h3>
    <div class="plan" onclick="purchase('weekly')">
      Weekly – $1
    </div>
    <div class="plan" onclick="purchase('monthly')">
      Monthly – $5
    </div>
    <div class="plan" onclick="purchase('yearly')">
      Yearly – $50
    </div>
    <button onclick="backToFeatures()">Cancel</button>
</div>

<script>
  const currentUser = { id: "12345", premium: false };

  // Feature list
  const FEATURES = [
    { name: "Profile Verification", icon: "https://cdn-icons-png.flaticon.com/512/1828/1828479.png" },
    { name: "Advanced File Manager", icon: "https://cdn-icons-png.flaticon.com/512/716/716784.png" },
    { name: "Custom Themes", icon: "https://cdn-icons-png.flaticon.com/512/1828/1828911.png" },
    { name: "Extended Status", icon: "https://cdn-icons-png.flaticon.com/512/1828/1828919.png" }
  ];

  const featureContainer = document.getElementById("featureList");
  const planPage = document.getElementById("plansPage");

  function renderFeatures() {
    featureContainer.innerHTML = "";
    FEATURES.forEach(f => {
      const div = document.createElement("div");
      div.className = "setting-btn";
      div.style.display = "flex";
      div.style.justifyContent = "space-between";
      div.style.alignItems = "center";
      div.style.padding = "12px";
      div.style.background = "#fff";
      div.style.borderRadius = "8px";
      div.style.marginTop = "8px";
      div.style.cursor = "pointer";

      div.innerHTML = `
        <span style="display:flex; align-items:center; gap:10px;">
          <img src="${f.icon}" width="24" height="24"> ${f.name} 
          <span id="tick-${f.name}" style="display:${currentUser.premium?'inline':'none'}; color:green; font-weight:bold;">✔</span>
        </span>
        <span>></span>
      `;

      div.onclick = () => {
        if(currentUser.premium){
          alert(`Access granted: ${f.name}`);
        } else {
          openPlanPage(f.name);
        }
      };

      featureContainer.appendChild(div);
    });
  }

  // Open plan selection for a specific feature
  function openPlanPage(featureName) {
    planPage.querySelector("h3").innerText = `Subscribe to unlock: ${featureName}`;
    featureContainer.style.display = "none";
    planPage.style.display = "block";
  }

  // Back to features list
  function backToFeatures() {
    planPage.style.display = "none";
    featureContainer.style.display = "block";
  }

  // Simulate purchase
  function purchase(plan) {
    alert("Processing " + plan + " plan...");
    fakePurchase(plan);
  }

  // Demo purchase
  function fakePurchase(plan) {
    setTimeout(() => {
      currentUser.premium = true; // unlock premium
      alert("✅ Purchase successful! You unlocked MEGA Premium (" + plan + ")");
      // Show ticks for all features
      FEATURES.forEach(f => {
        const tick = document.getElementById(`tick-${f.name}`);
        if(tick) tick.style.display = "inline";
      });
      backToFeatures();
    }, 1000);
  }

  // Initialize features on page load
  renderFeatures();
</script>
</body>
</html>
